name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Exporting for web is the cheapest end-to-end proof that every import
      # resolves and Metro can actually bundle the app. Deliberately built
      # WITHOUT Supabase env: CI keeps exercising the local-mode code path,
      # while the Pages workflow builds against the real project.
      - name: Build web
        run: npx expo export --platform web --output-dir dist

      - name: Check the export produced an entry point
        run: test -f dist/index.html
