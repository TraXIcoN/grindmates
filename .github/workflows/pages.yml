name: Deploy web demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The configure-pages step below provisions the Pages site itself on the first
# run, so there is nothing to switch on by hand. On a free plan Pages publishes
# from public repositories only.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The publishable key is the browser-facing client key: it ships inside
      # the JS bundle by design (every visitor's browser sends it), and
      # row-level security is the actual boundary. Committing it here is
      # equivalent to serving it, which Pages does anyway.
      - name: Build web
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://megneazswpqukohasryj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_2e_pBrWEsL0Rr7nommakxA_a_54sniB

      # Without this, GitHub Pages runs the output through Jekyll, which drops
      # every path beginning with an underscore — including Expo's entire
      # _expo/static bundle directory. The site would deploy and then 404 on
      # its own JavaScript.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # enablement: true provisions the Pages site through the API on the first
      # run, using the pages: write permission granted above. Without it the job
      # fails with "Get Pages site failed ... Not Found" until someone clicks
      # through Settings -> Pages. Requires a public repository on a free plan.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
